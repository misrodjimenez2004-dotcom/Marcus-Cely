<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aracely, Be My Valentine? 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root { --pink:#ff4d6d; }

body{
font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
background:black;
margin:0;
overflow:hidden;
height:100vh;
width:100vw;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

/* ---- Slideshow ---- */
.slideshow {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.45;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}
.slideshow img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 2s ease;
  opacity: 0;
}
.slideshow img:first-child { opacity: 1; }

/* Lyrics */
.lyrics{
position:fixed;
bottom:18px;
left:0;
right:0;
z-index:3;
color:white;
font-size:18px;
font-weight:bold;
text-shadow:0 2px 10px rgba(0,0,0,0.85);
}

/* ---- Glow Behind Card ---- */
.glassGlow {
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 330px;
  height: 180px;
  border-radius: 35px;
  background: radial-gradient(circle, rgba(255,140,180,0.35), rgba(255,140,180,0));
  filter: blur(45px);
  z-index: 2;
}

/* ---- Glass Card ---- */
.card {
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 88%;
  max-width: 360px;
  padding: 22px 20px;
  border-radius: 28px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  background: rgba(255, 255, 255, 0.22);
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  box-shadow:
    0 0 12px rgba(255, 150, 180, 0.45),
    0 0 25px rgba(255, 90, 140, 0.35),
    0 4px 25px rgba(0,0,0,0.35);
  z-index: 4;
}

h1 {
  color: var(--pink);
  margin: 0 0 12px 0;
  font-size: 20px;
  line-height: 1.25;
  font-weight: 700;
  text-shadow: 0 0 8px rgba(255, 140, 170, 0.45);
}

/* ---- Buttons ---- */
button {
  padding: 10px 20px;
  border: none;
  border-radius: 999px;
  font-size: 16px;
  cursor: pointer;
  margin: 6px;
  font-weight: 600;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
button:active { transform: scale(0.96); }

#yesBtn {
  background: linear-gradient(135deg, #ff4d6d, #ff6f9f);
  color: white;
  box-shadow: 0 0 12px rgba(255, 100, 150, 0.6);
}
#noBtn {
  background: rgba(255, 255, 255, 0.75);
  color: #333;
  box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

/* Floating hearts */
.heart{
position:absolute;
color:var(--pink);
font-size:20px;
animation:floatUp 6s linear infinite;
opacity:0.9;
text-shadow:0 0 12px rgba(255,77,109,0.7);
z-index:1;
}
@keyframes floatUp{
from{transform:translateY(110vh);}
to{transform:translateY(-15vh);opacity:0;}
}

/* Floating bears */
.bear{
position:absolute;
font-size:30px;
animation:floatSide 12s linear infinite;
z-index:1;
}
@keyframes floatSide{
from{transform:translateX(-15vw);}
to{transform:translateX(115vw);}
}
</style>
</head>

<body>

<!-- Slideshow -->
<div class="slideshow">
<img src="photo1.JPG">
<img src="photo2.jpeg">
<img src="photo3.JPG">
<img src="photo4.jpeg">
<img src="photo5.jpeg">
</div>

<div class="glassGlow"></div>

<div class="lyrics" id="lyricsText">
🎶 Aracely, there’s nothing on you 💖
</div>

<div class="card">
<h1>Aracely… will you be my Valentine? 💖</h1>
<button id="yesBtn">Yes 💕</button>
<button id="noBtn">No 😢</button>
<p style="font-size:13px;">Tap anywhere to start music 🎶</p>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// Start music on ANY interaction
const bgMusic = document.getElementById("bgMusic");
function startMusic() { bgMusic.play().catch(()=>{}); }

document.addEventListener("click", startMusic, { once: true });
document.addEventListener("touchstart", startMusic, { once: true });

// Slideshow rotation
const slides = document.querySelectorAll(".slideshow img");
let slideIndex = 0;
setInterval(() => {
  slides.forEach(i => i.style.opacity = 0);
  slideIndex = (slideIndex + 1) % slides.length;
  slides[slideIndex].style.opacity = 1;
}, 4000);

// Lyrics rotation
const lyricLines = [
"🎶 Aracely, there’s nothing on you 💖",
"✨ You’re my favorite person",
"💘 Nobody compares to you",
"🥰 My heart chose you",
"❤️ Forever us"
];
let l = 0;
setInterval(() => {
  l = (l + 1) % lyricLines.length;
  lyricsText.textContent = lyricLines[l];
}, 3500);

// Hearts
function spawnHeart(){
const h = document.createElement("div");
h.className = "heart";
h.textContent = "❤";
h.style.left = Math.random()*100 + "vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}
setInterval(spawnHeart, 500);

// Bears
function spawnBear(){
const b = document.createElement("div");
b.className = "bear";
b.textContent = "🧸";
b.style.top = Math.random()*80 + "vh";
document.body.appendChild(b);
setTimeout(()=>b.remove(),12000);
}
setInterval(spawnBear, 5000);

// No button moves AND starts music
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("click",(e)=>{
startMusic();
e.preventDefault();
noBtn.style.position="absolute";
noBtn.style.left=Math.random()*75+"vw";
noBtn.style.top=Math.random()*75+"vh";
});
noBtn.addEventListener("touchstart",(e)=>{
startMusic();
noBtn.style.left=Math.random()*75+"vw";
noBtn.style.top=Math.random()*75+"vh";
});

// ---- YES Button ----
const yesBtn = document.getElementById("yesBtn");
yesBtn.addEventListener("click", ()=>{
startMusic();
confetti({ particleCount: 200, spread: 120 });

setTimeout(()=>{
const msg="Thank you so so so so so so so much for being my valentines once again and I wouldn’t want it to be with anyone else but you my love! ❤️";

// Overlay that DOES NOT replace slideshow
const overlay=document.createElement("div");
overlay.style=`
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(4px);
z-index:9999;
`;

overlay.innerHTML=`
<div id='typedMessage' style="
font-family:'Great Vibes',cursive;
font-size:48px;
max-width:900px;
padding:40px;
color:#ffb6c1;
text-align:center;
text-shadow:0 0 15px rgba(255,182,193,0.85);
"></div>
`;

document.body.appendChild(overlay);

let i=0;
function type(){
document.getElementById("typedMessage").textContent = msg.slice(0,i);
i++;
if(i<=msg.length) setTimeout(type,30);
}
type();

},1200);

});
</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
