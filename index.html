<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta charset="UTF-8">
<title>For Aracely 💖</title>

<style>
/* ----------------------------------------------------
   GLOBAL RESET
---------------------------------------------------- */
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  background: #000;
  font-family: "Helvetica Neue", sans-serif;
}

/* ----------------------------------------------------
   FULLSCREEN SLIDESHOW (iPhone Notch FIX)
---------------------------------------------------- */
.slideshow {
  position: fixed;
  top: calc(0px - env(safe-area-inset-top));
  left: 0;
  width: 100vw;
  height: calc(100vh + env(safe-area-inset-top) + env(safe-area-inset-bottom));
  overflow: hidden;
  z-index: 0;
}

.slideshow img {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  height: 100%;
  object-fit: cover; 
  object-position: center;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 2s ease;
}

/* ----------------------------------------------------
   CARD (GLASS + GLOW)
---------------------------------------------------- */
.cardContainer {
  position: fixed;
  bottom: 10vh;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 20;
  padding-bottom: env(safe-area-inset-bottom);
}

.card {
  width: 88%;
  max-width: 380px;
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 28px;
  padding: 24px 20px;
  text-align: center;
  animation: fadeUp 1s ease forwards;
  color: white;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px);}
  to { opacity: 1; transform: translateY(0);}
}

.glassGlow {
  position: absolute;
  width: 86%;
  height: 40px;
  bottom: -10px;
  background: radial-gradient(circle, rgba(255,60,150,0.6), transparent);
  filter: blur(22px);
  border-radius: 50%;
  z-index: -1;
}

.card h1 {
  margin: 0;
  font-size: 1.6rem;
  font-weight: 700;
  color: #ff4da6;
}

button {
  border: none;
  padding: 12px 26px;
  font-size: 1.1rem;
  border-radius: 20px;
  margin: 10px;
  cursor: pointer;
}

#yesBtn {
  background: #ff2fa8;
  color: white;
}

#noBtn {
  background: #ffffffaa;
}

/* Move “no” button when tapped */
#noBtn:active {
  transform: translateX(50px) translateY(-20px);
}

/* ----------------------------------------------------
   FLOATING HEARTS + BEARS
---------------------------------------------------- */
.floating {
  position: fixed;
  font-size: 1.6rem;
  animation: floatUp 5s linear infinite;
  opacity: 0.8;
  z-index: 5;
}

@keyframes floatUp {
  0% { transform: translateY(20vh); opacity: 0;}
  20% {opacity: 1;}
  100% { transform: translateY(-120vh); opacity: 0;}
}

/* ----------------------------------------------------
   LYRICS TEXT
---------------------------------------------------- */
#lyrics {
  position: fixed;
  bottom: 5vh;
  width: 100%;
  text-align: center;
  font-size: 1.2rem;
  color: white;
  font-weight: 600;
  z-index: 15;
  text-shadow: 0 0 6px black;
}

/* ----------------------------------------------------
   MESSAGE OVERLAY (YES BUTTON)
---------------------------------------------------- */
#messageOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 50;
  text-align: center;
  padding: 20px;
}

#messageBox {
  background: rgba(255,255,255,0.12);
  padding: 24px;
  border-radius: 20px;
  width: 85%;
  color: white;
  font-size: 1.4rem;
  line-height: 1.6rem;
}

#surpriseBtn {
  margin-top: 18px;
  padding: 10px 22px;
  font-size: 1.1rem;
  border-radius: 20px;
  background: #ff4da6;
  color: white;
}

/* Typing effect */
.typing {
  border-right: 3px solid white;
  animation: blink 0.6s infinite;
}

@keyframes blink {
  50% { border-color: transparent; }
}

</style>
</head>

<body>

<!-- ---------------- SLIDESHOW ---------------- -->
<div class="slideshow">
  <img src="photo1.JPG">
  <img src="photo2.jpeg">
  <img src="photo3.JPG">
  <img src="photo4.jpeg">
  <img src="photo5.jpeg">
  <img src="photo6.JPG">
  <img src="photo7.JPG">
  <img src="photo8.JPG">
  <img src="photo9.jpeg">
  <img src="photo10.JPG">
  <img src="photo11.JPG">
  <img src="photo12.JPG">
  <img src="photo13.JPG">
  <img src="photo14.JPG">
  <img src="photo15.JPG">
  <img src="photo16.JPG">
  <img src="photo17.JPG">
  <img src="photo18.JPG">
  <img src="photo19.JPG">
</div>

<!-- ---------------- LYRICS ---------------- -->
<div id="lyrics">🎶 Tap anywhere to start music 🎶</div>

<!-- ---------------- QUESTION CARD ---------------- -->
<div class="cardContainer">
  <div class="glassGlow"></div>
  <div class="card">
    <h1>Aracely… will you be my Valentine? 💖</h1>
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😢</button>
  </div>
</div>

<!-- ---------------- MESSAGE AFTER YES ---------------- -->
<div id="messageOverlay">
  <div id="messageBox">
    <div id="typedText"></div>
    <button id="surpriseBtn">Click for a surprise 💝</button>
  </div>
</div>

<script>
/* ------------------------------------------------------
   MUSIC
------------------------------------------------------ */
let music = new Audio("song.mp3");
music.loop = true;
let musicStarted = false;

function startMusic() {
  if (!musicStarted) {
    music.play();
    musicStarted = true;
  }
}

/* Play when tapping anywhere */
document.body.addEventListener("click", startMusic);

/* ------------------------------------------------------
   SLIDESHOW
------------------------------------------------------ */
let slides = document.querySelectorAll(".slideshow img");
let index = 0;

function showSlide() {
  slides.forEach(s => s.style.opacity = 0);
  slides[index].style.opacity = 1;
  index = (index + 1) % slides.length;
}

showSlide();
setInterval(showSlide, 4000);

/* ------------------------------------------------------
   FLOATING HEARTS + BEARS
------------------------------------------------------ */
function spawnFloating() {
  let el = document.createElement("div");
  el.className = "floating";
  el.innerText = Math.random() < 0.5 ? "❤️" : "🧸";
  el.style.left = Math.random()*90 + "vw";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),5000);
}
setInterval(spawnFloating, 900);

/* ------------------------------------------------------
   LYRICS (Simple cycling)
------------------------------------------------------ */
const lyricLines = [
  "🎵 Aracely, there's nothing on you 💖",
  "✨ You're my favorite person",
  "💘 You're my whole heart"
];
let lyricIndex = 0;
setInterval(()=>{
  document.getElementById("lyrics").textContent = lyricLines[lyricIndex];
  lyricIndex = (lyricIndex+1) % lyricLines.length;
},4000);

/* ------------------------------------------------------
   YES BUTTON → MESSAGE + CONFETTI
------------------------------------------------------ */
document.getElementById("yesBtn").addEventListener("click", ()=>{
  document.getElementById("messageOverlay").style.display = "flex";
  startMusic();

  const message = 
    "Thank you so so so so so so so much for being my Valentine once again, and I wouldn’t want it to be with anyone else but you my love! ❤️";
  
  let i = 0;
  let textBox = document.getElementById("typedText");
  textBox.innerHTML = "";
  
  let typer = setInterval(()=>{
    textBox.textContent = message.substring(0, i);
    i++;
    if (i > message.length) clearInterval(typer);
  }, 40);
});

/* ------------------------------------------------------
   SURPRISE BUTTON → CLEAN SLIDESHOW ONLY
------------------------------------------------------ */
document.getElementById("surpriseBtn").addEventListener("click", ()=>{
  document.querySelector(".cardContainer").style.display = "none";
  document.getElementById("messageOverlay").style.display = "none";
  document.getElementById("lyrics").style.opacity = "0"; 
  startMusic();
});
</script>

</body>
</html>
