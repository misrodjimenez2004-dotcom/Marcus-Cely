<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aracely, Be My Valentine? 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root { --pink:#ff4d6d; }

body{
font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
background:black;
margin:0;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

/* Slideshow */
.slideshow{
position:fixed;
inset:0;
z-index:0;
opacity:0.45;
}
.slideshow img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
transition:opacity 2s ease;
opacity:0;
}
.slideshow img:first-child{opacity:1;}

/* Lyrics */
.lyrics{
position:fixed;
bottom:24px;
left:0;
right:0;
z-index:3;
color:white;
font-size:18px;
font-weight:bold;
text-shadow:0 2px 10px rgba(0,0,0,0.85);
padding:0 16px;
}

/* Card */
.card{
background:rgba(255,255,255,0.92);
padding:28px 22px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.45);
max-width:440px;
z-index:4;
}
h1{
color:var(--pink);
margin:0 0 14px 0;
font-size:26px;
}
button{
padding:12px 22px;
border:none;
border-radius:999px;
font-size:18px;
cursor:pointer;
margin:10px;
}
#yesBtn{background:var(--pink);color:white;}
#noBtn{background:#e6e6e6;position:relative;}

/* Floating hearts */
.heart{
position:absolute;
color:var(--pink);
font-size:20px;
animation:floatUp 6s linear infinite;
opacity:0.9;
text-shadow:0 0 12px rgba(255,77,109,0.7);
z-index:1;
}
@keyframes floatUp{
from{transform:translateY(110vh);}
to{transform:translateY(-15vh);opacity:0;}
}

/* Floating bears */
.bear{
position:absolute;
font-size:30px;
animation:floatSide 12s linear infinite;
z-index:1;
}
@keyframes floatSide{
from{transform:translateX(-15vw);}
to{transform:translateX(115vw);}
}
</style>
</head>

<body>

<!-- Slideshow Photos -->
<div class="slideshow">
<img src="photo1.jpg">
<img src="photo2.jpeg">
<img src="photo3.jpg">
<img src="photo4.jpeg">
<img src="photo5.jpeg">
</div>

<div class="lyrics" id="lyricsText">
🎶 Aracely, there’s nothing on you 💖
</div>

<div class="card">
<h1>Aracely… will you be my Valentine? 💖</h1>
<button id="yesBtn">Yes 💕</button>
<button id="noBtn">No 😢</button>
<p style="font-size:13px;">Tap anywhere to start music 🎶</p>
</div>

<!-- MP3 Audio (iPhone-friendly) -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// iPhone must tap to allow audio
document.addEventListener("click", () => {
  document.getElementById("bgMusic").play().catch(()=>{});
}, { once:true });
</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const lyricsText=document.getElementById("lyricsText");

/* Confetti */
function launchConfetti(){
const duration=2500;
const end=Date.now()+duration;
(function frame(){
confetti({particleCount:8,angle:60,spread:60,origin:{x:0}});
confetti({particleCount:8,angle:120,spread:60,origin:{x:1}});
if(Date.now()<end){requestAnimationFrame(frame);}
})();
}

/* No button escapes */
function moveNoButton(){
const maxX=window.innerWidth-noBtn.offsetWidth-20;
const maxY=window.innerHeight-noBtn.offsetHeight-20;
noBtn.style.position="absolute";
noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";
}
noBtn.addEventListener("click",(e)=>{e.preventDefault();moveNoButton();});
noBtn.addEventListener("touchstart",(e)=>{e.preventDefault();moveNoButton();});

/* Slideshow */
const slides=document.querySelectorAll(".slideshow img");
let slideIndex=0;
setInterval(()=>{
slides.forEach(img=>img.style.opacity=0);
slideIndex=(slideIndex+1)%slides.length;
slides[slideIndex].style.opacity=1;
},4000);

/* Lyrics rotation */
const lines=[
"🎶 Aracely, there’s nothing on you 💖",
"✨ You’re my favorite person",
"💘 Nobody compares to you",
"🥰 My heart chose you",
"❤️ Forever us"
];
let lineIndex=0;
setInterval(()=>{
lineIndex=(lineIndex+1)%lines.length;
lyricsText.textContent=lines[lineIndex];
},3500);

/* Floating hearts */
function spawnHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.textContent="❤";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
}
setInterval(spawnHeart,500);

/* Floating bears */
function spawnBear(){
const bear=document.createElement("div");
bear.className="bear";
bear.textContent="🧸";
bear.style.top=Math.random()*80+"vh";
document.body.appendChild(bear);
setTimeout(()=>bear.remove(),12000);
}
setInterval(spawnBear,5000);

/* YES CLICK → Confetti + Typing Message */
yesBtn.addEventListener("click",()=>{
launchConfetti();
setTimeout(()=>{
const message="Thank you so so so so so so so much for being my valentines once again and I wouldn’t want it to be with anyone else but you my love! ❤️";
document.body.innerHTML=`
<div style="position:relative;height:100vh;display:flex;justify-content:center;align-items:center;background:black;padding:40px;text-align:center;">
<div id="heartLayer" style="position:absolute;inset:0;"></div>
<div style="max-width:900px;z-index:2;">
<div id="typedMessage" style="font-family:'Great Vibes',cursive;font-size:48px;line-height:1.4;color:#ffb6c1;text-shadow:0 0 15px rgba(255,182,193,0.85);"></div>
</div>
</div>`;
const typedEl=document.getElementById("typedMessage");
let i=0;
function typeNext(){
typedEl.textContent=message.slice(0,i);
i++;
if(i<=message.length){setTimeout(typeNext,30);}
}
typeNext();
},1200);
});
</script>

</body>
</html>
