<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aracely, Be My Valentine? 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root { 
  --pink:#ff4d6d;
  --glowpink: rgba(255, 150, 180, 0.45);
}

body {
  margin:0;
  overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:black;
}

/* ---------------- FIXED SLIDESHOW (force full image fit) ---------------- */
.slideshow {
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:black;
}

/* ⭐ FINAL FIX — FORCES ALL IMAGES TO FIT PERFECTLY ON ANY iPHONE */
.slideshow img {
  position:absolute;
  top:50%;
  left:50%;
  width:100vw !important;
  height:100vh !important;
  object-fit:contain !important;   /* ⭐ NEVER CROPS, ALWAYS FITS */
  object-position:center !important;
  transform:translate(-50%, -50%);
  opacity:0;
  transition:opacity 1.5s ease;
  background:black;
  max-width:100vw !important;
  max-height:100vh !important;
}

/* Slideshow fade timing */
.slideshow img.show {
  opacity:1 !important;
}

/* ---------------- LYRICS ---------------- */
.lyrics {
  position:fixed;
  bottom:22px;
  left:0; right:0;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  color:white;
  z-index:10;
  text-shadow:0 0 12px black;
}

/* ---------------- CARD ---------------- */
.glassGlow {
  position:absolute;
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
  width:330px;
  height:180px;
  border-radius:35px;
  background:radial-gradient(circle, rgba(255,140,180,0.35), rgba(255,140,180,0));
  filter:blur(45px);
  z-index:3;
}

.card {
  position:absolute;
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
  width:88%;
  max-width:360px;
  padding:22px 20px;
  border-radius:28px;
  background:rgba(255,255,255,0.22);
  backdrop-filter:blur(18px);
  border:1.5px solid rgba(255,255,255,0.35);
  box-shadow:0 0 12px var(--glowpink), 0 0 25px rgba(255,90,140,0.35);
  text-align:center;
  z-index:12;
}

h1 {
  font-size:20px;
  margin:0 0 12px;
  color:var(--pink);
  text-shadow:0 0 8px rgba(255,120,150,0.45);
}

button {
  padding:10px 20px;
  border:none;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
  margin:6px;
}
button:active { transform:scale(0.96); }

#yesBtn {
  background:linear-gradient(135deg,#ff4d6d,#ff6f9f);
  color:white;
  box-shadow:0 0 12px rgba(255,100,150,0.7);
}
#noBtn {
  background:rgba(255,255,255,0.75);
  color:#333;
  box-shadow:0 0 10px rgba(255,255,255,0.4);
}

/* ---------------- SURPRISE BUTTON ---------------- */
.surpriseBtn {
  background:linear-gradient(135deg,#ff6fa8,#ff8fc4);
  padding:12px 26px;
  border-radius:999px;
  font-size:20px;
  color:white;
  border:none;
  cursor:pointer;
  margin-top:25px;
  font-weight:700;
  box-shadow:0 0 18px rgba(255,120,160,0.9);
  animation:float 3s ease-in-out infinite;
  opacity:0;
  transition:opacity 1s ease;
}
@keyframes float {
  0% { transform:translateY(0); }
  50% { transform:translateY(-6px); }
  100% { transform:translateY(0); }
}
</style>
</head>

<body>

<!-- ---------------- SLIDESHOW IMAGES ---------------- -->
<div class="slideshow">
<img src="photo1.JPG">
<img src="photo2.jpeg">
<img src="photo3.JPG">
<img src="photo4.jpeg">
<img src="photo5.jpeg">
<img src="photo6.JPG">
<img src="photo7.JPG">
<img src="photo8.JPG">
<img src="photo9.jpeg">
<img src="photo10.JPG">
<img src="photo11.JPG">
<img src="photo12.JPG">
<img src="photo13.JPG">
<img src="photo14.JPG">
<img src="photo15.JPG">
<img src="photo16.JPG">
<img src="photo17.JPG">
<img src="photo18.JPG">
<img src="photo19.JPG">
</div>

<div class="glassGlow"></div>

<div class="lyrics" id="lyricsText">🎶 Aracely, there’s nothing on you 💖</div>

<div class="card">
<h1>Aracely… will you be my Valentine? 💖</h1>
<button id="yesBtn">Yes 💕</button>
<button id="noBtn">No 😢</button>
<p style="font-size:13px;">Tap anywhere to start music 🎶</p>
</div>

<!-- ---------------- MUSIC ---------------- -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// MUSIC
const bgMusic=document.getElementById("bgMusic");
function startMusic(){ bgMusic.play().catch(()=>{}); }
document.addEventListener("click", startMusic, { once:true });
document.addEventListener("touchstart", startMusic, { once:true });

// SLIDESHOW
const slides=document.querySelectorAll(".slideshow img");
let i=0;
slides[0].classList.add("show");
setInterval(()=>{
  slides[i].classList.remove("show");
  i=(i+1)%slides.length;
  slides[i].classList.add("show");
},4000);

// LYRICS
const lyricLines=[
"🎶 Aracely, there’s nothing on you 💖",
"✨ You’re my favorite person",
"💘 Nobody compares to you",
"🥰 My heart chose you",
"❤️ Forever us"
];
let l=0;
setInterval(()=>{
  l=(l+1)%lyricLines.length;
  lyricsText.textContent=lyricLines[l];
},3000);

// NO BUTTON RUNS AWAY
noBtn.addEventListener("click",(e)=>{
  startMusic();
  e.preventDefault();
  noBtn.style.position="absolute";
  noBtn.style.left=Math.random()*70+"vw";
  noBtn.style.top=Math.random()*70+"vh";
});

// YES BUTTON
yesBtn.addEventListener("click", ()=>{

  startMusic();

  // MESSAGE
  const msg="Thank you so so so so so so so much for being my valentines once again and I wouldn’t want it to be with anyone else but you my love! ❤️";

  const overlay=document.createElement("div");
  overlay.style=`
    position:fixed; inset:0; display:flex;
    flex-direction:column; justify-content:center;
    align-items:center; background:rgba(0,0,0,0.55);
    backdrop-filter:blur(4px); z-index:9999;
  `;

  overlay.innerHTML=`
    <div id="typedMessage" style="
      font-family:'Great Vibes',cursive;
      font-size:48px; max-width:900px;
      padding:40px; color:#ffb6c1;
      text-align:center;
      text-shadow:0 0 15px rgba(255,182,193,0.85);
    "></div>
    <button id="surpriseBtn" class="surpriseBtn">Click for a surprise 💝</button>
  `;

  document.body.appendChild(overlay);

  let x=0;
  function type(){
    document.getElementById("typedMessage").textContent=msg.slice(0,x);
    x++;
    if(x<=msg.length) setTimeout(type,30);
    else document.getElementById("surpriseBtn").style.opacity=1;
  }
  type();

  document.getElementById("surpriseBtn").addEventListener("click", ()=>{
    overlay.remove();
    document.querySelector(".card").style.display="none";
    document.querySelector(".glassGlow").style.display="none";
    startMusic();
  });
});
</script>

</body>
</html>
